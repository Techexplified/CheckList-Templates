
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connect Trello</title>
  <script src="https://p.trellocdn.com/power-up.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px;
      background: #fff;
      color: #172b4d;
      font-family: -apple-system, BlinkMacSystemFont,
        "Segoe UI", Arial, sans-serif;
    }

    .container { text-align: center; }

    h2 { margin: 0 0 8px; font-size: 20px; }

    p {
      margin: 0 auto 20px;
      max-width: 340px;
      color: #5e6c84;
      font-size: 14px;
      line-height: 1.5;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 6px;
      padding: 11px 16px;
      background: #0c66e4;
      color: white;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    button:disabled { opacity: .6; cursor: default; }

    .status {
      margin-top: 14px;
      font-size: 13px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .error { color: #c9372c; }
    .success { color: #216e4e; }
  </style>
</head>

<body>
  <div class="container">
    <h2>Connect Trello</h2>
    <p>
      Connect Reusable Checklist Library to Trello
      so you can add checklist templates to cards.
    </p>

    <button id="authorizeButton">Connect to Trello</button>
    <div id="status" class="status" role="status"></div>
  </div>

  <script type="module">
    import { APP_KEY, APP_NAME } from "./src/lib/auth.js";

    const button = document.getElementById("authorizeButton");
    const status = document.getElementById("status");

    function showStatus(message, type = "") {
      status.textContent = message;
      status.className = `status ${type}`;
    }

    if (!APP_KEY) {
      button.disabled = true;
      showStatus(
        "Trello API key is missing. Check VITE_TRELLO_APP_KEY.",
        "error"
      );
    } else {
      const t = window.TrelloPowerUp.iframe({
        appKey: APP_KEY,
        appName: APP_NAME
      });

      async function checkAuthorization() {
        try {
          const api = await t.getRestApi();

          if (await api.isAuthorized()) {
            button.textContent = "Already Connected";
            button.disabled = true;
            showStatus(
              "Your Trello account is already connected.",
              "success"
            );
          }
        } catch (error) {
          console.error(
            "[Checklist Library] Authorization check failed:",
            error
          );
          showStatus(
            "Could not check authorization. Click Connect to try again.",
            "error"
          );
        }
      }

      button.addEventListener("click", async () => {
        button.disabled = true;
        button.textContent = "Connecting...";
        showStatus("Opening Trello authorization...");

        try {
          const api = await t.getRestApi();

          await api.authorize({
            expiration: "never",
            scope: "read,write"
          });

          const authorized = await api.isAuthorized();

          if (!authorized) {
            throw new Error(
              "Trello authorization did not complete."
            );
          }

          button.textContent = "Connected";
          showStatus(
            "Connected successfully. Close this window and try Add to Card again.",
            "success"
          );

          try {
            t.notifyParent("done");
          } catch (notifyError) {
            console.warn(
              "[Checklist Library] Could not notify parent:",
              notifyError
            );
          }
        } catch (error) {
          console.error(
            "[Checklist Library] Authorization failed:",
            error
          );

          showStatus(
            error?.message || "Authorization failed. Please try again.",
            "error"
          );

          button.disabled = false;
          button.textContent = "Try Again";
        }
      });

      checkAuthorization();
    }
  </script>
</body>
</html>
